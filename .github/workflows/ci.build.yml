name: ci.build

# The triggers follow ci.frontend, narrowed to what can break the native build: the crate, the toolchain pin and the
# Tauri CLI. A frontend-only change is proven by ci.frontend's yarn build.
on:
  push:
    branches: [develop]
    paths:
      - 'src-tauri/**'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ci.build.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'src-tauri/**'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ci.build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No debuginfo in the dev profile: it is most of the link time and of the cached target dir, and CI never debugs.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'

# dtolnay/rust-toolchain needs the channel as an input; each job's pin step reads it from rust-toolchain.toml so the pin
# lives in one place.
jobs:
  build:
    name: tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Rust toolchain
        id: pin
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Install Strawberry Perl (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install strawberryperl -y --no-progress
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: yarn install --frozen-lockfile
      # The apps compile the kit from source, and the kit's tsconfig extends the one svelte-kit generates.
      - run: yarn workspace @eden/ui-kit svelte-kit sync
      # A debug build for the host arch, bundled, proves the crate and the bundle config compile on each OS; the optimized
      # universal build (two full release compiles) is cd.release's job. Updater artifacts are off: a CI build has no
      # signing key, and the release workflow is where they are made.
      - run: yarn tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false}}' --features desktop

  # Android is compile-checked only (no bundle) so a desktop change that leaks into shared code cannot break the mobile
  # build unnoticed. iOS needs no job here: ci.rust's clippy already compiles the mobile feature for aarch64-apple-ios.
  android:
    name: cargo check (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Rust toolchain
        id: pin
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: mobile-android
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # The NDK clang and ar for the crates that build C; the API level matches minSdkVersion 29.
      - name: Configure the Android NDK toolchain
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          {
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "CC_aarch64-linux-android=$TOOLCHAIN/bin/aarch64-linux-android29-clang"
            echo "CXX_aarch64-linux-android=$TOOLCHAIN/bin/aarch64-linux-android29-clang++"
            echo "AR_aarch64-linux-android=$TOOLCHAIN/bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android29-clang"
          } >> "$GITHUB_ENV"
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --no-default-features --features mobile
