name: ci.rust

on:
  push:
    branches: ['**']
    paths:
      - 'src-tauri/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.rust.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dtolnay/rust-toolchain needs the channel as an input; each job's pin step reads it from rust-toolchain.toml so the pin
# lives in one place.
jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Rust toolchain
        id: pin
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  clippy:
    name: cargo clippy and test (${{ matrix.features }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The desktop feature on the host; the mobile feature against the iOS target, the way it is really built
          # (a desktop host would resolve the desktop capability against plugins the mobile feature does not compile).
          - features: desktop
            target: ''
          - features: mobile
            target: --target aarch64-apple-ios --no-default-features
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Rust toolchain
        id: pin
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: clippy-${{ matrix.features }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml ${{ matrix.target }} --features ${{ matrix.features }} -- -D warnings
      - if: matrix.features == 'desktop'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Rust toolchain
        id: pin
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock
