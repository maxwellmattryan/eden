name: vrt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

env:
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  vrt:
    name: visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: yarn storybook:build

      # Pull requests compare against the latest baselines main produced (D-50: baselines are artifacts, never committed).
      - name: Fetch the latest baselines from main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow vrt.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then
            gh run download "$id" -n vrt-baselines -D packages/ui-kit/src/vrt/__baselines__
            echo "baselines from run $id: $(ls packages/ui-kit/src/vrt/__baselines__ | wc -l) files"
          else
            echo "no baselines on main yet; this run only writes them"
          fi
      - name: Compare
        if: github.event_name == 'pull_request'
        run: yarn workspace @eden/ui-kit run vrt
      - name: Upload the diffs
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vrt-diffs
          path: packages/ui-kit/vrt/__diff__
          retention-days: 14

      # main regenerates the baselines and keeps them as an artifact
      - name: Regenerate baselines
        if: github.event_name != 'pull_request'
        run: yarn workspace @eden/ui-kit run vrt:update
      - name: Upload the baselines
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vrt-baselines
          path: packages/ui-kit/src/vrt/__baselines__
          retention-days: 90
