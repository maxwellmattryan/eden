[package]
name = "eden-app"
version = "0.1.0"
description = "Eden, a personal digital garden: the Tauri shell for the desktop and mobile apps."
authors = ["Matthew Maxwell"]
edition = "2021"
publish = false

[lib]
name = "eden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# No default features: every build selects its platform explicitly — desktop with
# `--features desktop`, mobile with `--features mobile`. `desktop` MUST NOT be a default
# feature: `tauri ios/android dev|build` has no `--no-default-features` flag and always
# inherits the crate's default features, so a desktop default leaks desktop-only deps
# (souvlaki, the native menu, rodio, …) into the iOS/Android build and breaks compilation.
default = []
# Desktop-only: the updater with the channel guard, the process plugin (relaunch after an update) and window-state.
desktop = [
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-updater",
]
# Mobile-only: haptics (light impact feedback on tap).
mobile = ["dep:tauri-plugin-haptics"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

# The linker for the Swift WeatherKit bridge (D-57), on Apple hosts only: build.rs links the package when the target is
# macOS or iOS and does nothing anywhere else. Already in the tree through Tauri.
[target.'cfg(target_vendor = "apple")'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }

[dependencies]
# 2.11 floor: `Builder::on_web_content_process_terminate` (webview crash recovery) landed in 2.11.
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.6"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-notification = "2.5"
tauri-plugin-window-state = { version = "2.5", optional = true }
tauri-plugin-process = { version = "2.4", optional = true }
tauri-plugin-updater = { version = "2.13", optional = true }
tauri-plugin-haptics = { version = "2.4", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
semver = "1.0"
sysinfo = "0.37"
thiserror = "2.0"
# The workspace database (docs/engineering/data-layer.md): SQLCipher built from source with its own OpenSSL, so every
# target links the same encrypted SQLite and nothing depends on a system library.
rusqlite = { version = "0.38.0", features = ["bundled-sqlcipher-vendored-openssl"] }
# Entity ids (D-24): sortable by creation time, generated monotonically within the process.
ulid = "1"
# The hash of an attachment's bytes, and of each file in an export bundle; already in the tree.
sha2 = "0.10"
# The export bundle is a zip archive, which every system opens without a tool. Direct, so that mobile has it too: it
# is otherwise in the tree only through the desktop updater.
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Real zones for the scheduler's tests: a daily time the clocks skip, and one they repeat.
chrono-tz = "0.10"

# iOS unified logging: a normally-launched app's stderr is discarded by iOS, so `env_logger` output never reaches
# Console.app. `oslog` routes the `log` facade to os_log under the app's identifier as subsystem.
# `security-framework` holds the database key in the Keychain; already in the tree through Tauri.
[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"
security-framework = "3.7"
security-framework-sys = "2"

# Android counterpart: stderr never reaches logcat, so route the `log` facade there.
# `jni` and `ndk-context` reach the Keystore-backed database key (`android/EdenDbKey.kt`); already in the tree.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"
ndk-context = "0.1"
