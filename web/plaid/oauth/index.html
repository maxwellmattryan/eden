<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Eden</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 16px;
				font:
					16px/1.5 system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				background: #f6f4ec;
				color: #1f2a22;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #0f1512;
					color: #e6ebe4;
				}
			}
			main {
				max-width: 28rem;
				text-align: center;
			}
			h1 {
				margin: 0 0 8px;
				font:
					600 28px/1.2 ui-serif,
					Georgia,
					serif;
			}
			p {
				margin: 0;
				color: #3d4a41;
			}
			@media (prefers-color-scheme: dark) {
				p {
					color: #c3ccc2;
				}
			}
		</style>
	</head>
	<body>
		<!--
			Where Plaid's hosted Link sends the browser when the owner is done (Orchard, #73), at the registered
			redirect address. On the desktop it is the hand-back: Eden learns the result by polling Plaid from the app,
			never from this page, so the page has no script, makes no request and reads nothing from its address. On
			iOS the Universal Link in /.well-known/apple-app-site-association opens Eden instead (#89).
		-->
		<main>
			<h1>You're done here</h1>
			<p>Go back to Eden to see your accounts. You can close this tab.</p>
		</main>
	</body>
</html>
