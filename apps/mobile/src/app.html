<!doctype html>
<html lang="en" data-platform="mobile">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<!-- The kit's pre-paint script, inlined by src/hooks.server.ts: theme, accent, brand, font and density from
		     localStorage before the first frame, so nothing flashes. -->
		<script>
			%eden.prepaint%
		</script>
		<title>Eden</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- The splash (docs/design/brand.md), inlined by src/hooks.server.ts: the app mark in the brand colour, the
		     wordmark and the version on the page surface, with its own stylesheet, painted before any JavaScript runs.
		     The Svelte SplashScreen takes over once the layout mounts. -->
		%eden.splash%
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
