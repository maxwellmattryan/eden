<!doctype html>
<html lang="en" data-platform="desktop">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The kit's pre-paint script, inlined by src/hooks.server.ts: theme, accent, brand, font and density from
		     localStorage before the first frame, so nothing flashes. -->
		<script>
			%eden.prepaint%
		</script>
		<title>Eden</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- The splash (docs/design/brand.md): the wordmark and the version on the page surface, painted before any
		     JavaScript runs and removed by the layout once the app has mounted. Colours and faces come from the kit's
		     variables, which the blocking stylesheets define; no font is fetched from anywhere. -->
		<div
			id="splash"
			aria-hidden="true"
			style="
				position: fixed;
				inset: 0;
				z-index: 9998;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
				background: var(--surface-0);
				color: var(--text-primary);
			"
		>
			<span style="font: var(--ed-t-display-xl); letter-spacing: var(--ed-t-display-xl-tracking)">eden</span>
			<span style="font: var(--ed-t-caption); color: var(--text-secondary)">v%sveltekit.env.PUBLIC_APP_VERSION%</span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
